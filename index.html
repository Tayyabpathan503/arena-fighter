<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arena Fighter 2.0</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#03050b;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 50% 10%,#182c49 0,#070b14 42%,#020308 100%);
}

h1{
  margin:10px 0 2px;
  font-size:25px;
  letter-spacing:1px;
  text-shadow:0 0 15px #00d9ff;
}

.subtitle{
  color:#91a0bd;
  font-size:12px;
  margin-bottom:8px;
}

/* ================= STATUS ================= */

.top{
  width:94%;
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.box{
  flex:1;
  background:linear-gradient(145deg,#151d2d,#080d18);
  border:1px solid #354662;
  border-radius:12px;
  padding:7px;
  box-shadow:inset 0 0 15px #0008,0 5px 20px #0008;
}

.name{
  font-size:12px;
  font-weight:bold;
}

.bar{
  height:14px;
  margin-top:4px;
  background:#151a25;
  border:1px solid #000;
  border-radius:20px;
  overflow:hidden;
  box-shadow:inset 0 2px 5px #000;
}

.fill{
  height:100%;
  width:100%;
  transition:width .25s;
}

.hp{
  background:linear-gradient(90deg,#0a9e4b,#26f27b);
  box-shadow:0 0 12px #16e879;
}

.ehp{
  background:linear-gradient(90deg,#b70c29,#ff4055);
  box-shadow:0 0 12px #ff304d;
}

.energy{
  background:linear-gradient(90deg,#007ca8,#00eaff);
  box-shadow:0 0 12px #00d9ff;
}

.round{
  min-width:105px;
  padding:8px;
  border-radius:11px;
  background:linear-gradient(#202b42,#101625);
  border:1px solid #ffd54a;
  color:#ffd54a;
  font-size:15px;
  font-weight:bold;
  text-shadow:0 0 8px #ff9800;
  box-shadow:0 0 20px #ff9d001c;
}

.round small{
  display:block;
  margin-top:3px;
  color:#fff;
  font-size:9px;
}

/* ================= ARENA ================= */

.arena{
  position:relative;
  width:94%;
  max-width:900px;
  height:430px;
  margin:10px auto;
  overflow:hidden;
  border:2px solid #465a79;
  border-radius:18px;

  background:
    radial-gradient(circle at 50% 24%,#41668f 0,#202f4b 23%,#111a2b 52%,#050812 100%);

  box-shadow:
    0 0 35px #00c8ff20,
    inset 0 0 80px #000c;
}

/* distant lights */

.arena:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 12% 20%,#00cfff55 0 2px,transparent 4px),
    radial-gradient(circle at 88% 20%,#ff304455 0 2px,transparent 4px),
    linear-gradient(90deg,transparent 0 10%,#ffffff08 10.2% 10.5%,transparent 10.7% 89.3%,#ffffff08 89.5% 89.8%,transparent 90%);
  pointer-events:none;
}

/* arena ceiling lights */

.arena:after{
  content:"";
  position:absolute;
  top:25px;
  left:8%;
  width:84%;
  height:3px;
  background:linear-gradient(90deg,
    transparent,
    #00d9ff,
    #ffffff,
    #ff3155,
    transparent
  );
  box-shadow:
    0 0 15px #00d9ff,
    0 0 25px #ff3155;
  opacity:.8;
}

/* FLOOR */

.ground{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:125px;
  z-index:1;

  background:
    linear-gradient(170deg,transparent 0 32%,#24334a 33%,#111a29 34%),
    repeating-linear-gradient(
      90deg,
      #111a29 0 55px,
      #18263a 56px 57px
    );

  border-top:2px solid #667b98;

  transform-origin:bottom;
  box-shadow:inset 0 25px 40px #0008;
}

/* floor grid */

.ground:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(#ffffff0b 1px,transparent 1px),
    linear-gradient(90deg,#ffffff0b 1px,transparent 1px);
  background-size:100% 25px,45px 100%;
  transform:perspective(250px) rotateX(45deg) scale(1.4);
  transform-origin:bottom;
}

/* arena pillars */

.pillar{
  position:absolute;
  top:75px;
  width:25px;
  height:230px;
  background:linear-gradient(90deg,#111827,#5b6d87,#151d2d);
  box-shadow:0 0 20px #000;
  z-index:0;
}

.pillar.left{
  left:35px;
}

.pillar.right{
  right:35px;
}

.light{
  position:absolute;
  width:10px;
  height:100px;
  top:95px;
  border-radius:20px;
  background:#00d9ff;
  box-shadow:0 0 25px #00d9ff;
  opacity:.55;
}

.light.l{
  left:68px;
}

.light.r{
  right:68px;
  background:#ff3155;
  box-shadow:0 0 25px #ff3155;
}

/* ================= FIGHTERS ================= */

.fighter{
  position:absolute;
  bottom:108px;
  width:100px;
  height:175px;
  z-index:10;
  transition:left .12s;
  filter:drop-shadow(0 15px 8px #0009);
}

#player{
  left:70px;
}

#enemy{
  right:70px;
}

/* body */

.body{
  position:absolute;
  width:52px;
  height:72px;
  left:24px;
  top:45px;
  border-radius:18px 18px 12px 12px;
  z-index:4;
}

.playerBody{
  background:
    linear-gradient(90deg,#073b75,#29b9ff 45%,#0c55c9);
  border:2px solid #54d9ff;
  box-shadow:
    inset -10px 0 12px #001c55,
    0 0 18px #00bfff66;
}

.enemyBody{
  background:
    linear-gradient(90deg,#7d0920,#ff465c 48%,#9b0b28);
  border:2px solid #ff7180;
  box-shadow:
    inset -10px 0 12px #51000f,
    0 0 18px #ff244866;
}

/* head */

.head{
  position:absolute;
  width:45px;
  height:45px;
  left:27px;
  top:3px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,#ffe2c1,#d18c62 72%);
  border:3px solid #17100e;
  z-index:7;
  box-shadow:inset -7px -5px 8px #7d4d35;
}

/* hair */

.head:before{
  content:"";
  position:absolute;
  width:45px;
  height:20px;
  left:-3px;
  top:-3px;
  border-radius:50% 50% 35% 35%;
  background:#10131b;
}

/* face */

.head:after{
  content:"";
  position:absolute;
  width:7px;
  height:4px;
  left:27px;
  top:22px;
  border-radius:50%;
  background:#111;
  box-shadow:-18px 0 #111;
}

/* arms */

.arm{
  position:absolute;
  width:19px;
  height:68px;
  top:51px;
  border-radius:15px;
  z-index:3;
  transform-origin:top center;
}

.arm1{
  left:8px;
  transform:rotate(20deg);
}

.arm2{
  right:8px;
  transform:rotate(-20deg);
}

.playerArm{
  background:linear-gradient(90deg,#0c438e,#25c9ff);
  border:2px solid #4edcff;
}

.enemyArm{
  background:linear-gradient(90deg,#8d1029,#ff5063);
  border:2px solid #ff7180;
}

/* fists */

.arm:after{
  content:"";
  position:absolute;
  width:23px;
  height:23px;
  bottom:-9px;
  left:-4px;
  border-radius:50%;
  background:#d99469;
  border:2px solid #20130e;
}

/* legs */

.leg{
  position:absolute;
  width:22px;
  height:70px;
  top:110px;
  border-radius:13px;
  z-index:2;
  transform-origin:top center;
}

.leg1{
  left:27px;
}

.leg2{
  right:27px;
}

.playerLeg{
  background:linear-gradient(90deg,#092f69,#1a76dc);
  border:2px solid #3fa8ff;
}

.enemyLeg{
  background:linear-gradient(90deg,#5c091b,#c82342);
  border:2px solid #ff516b;
}

.leg:after{
  content:"";
  position:absolute;
  width:35px;
  height:16px;
  bottom:-6px;
  left:-8px;
  border-radius:12px;
  background:#111827;
  border:2px solid #333e55;
}

/* fighter shadow */

.fighter:after{
  content:"";
  position:absolute;
  width:100px;
  height:18px;
  bottom:-12px;
  left:0;
  border-radius:50%;
  background:#0009;
  filter:blur(3px);
  z-index:-1;
}

/* ================= ANIMATIONS ================= */

.punchAnim .arm2{
  animation:punchArm .28s ease;
}

.punchAnim{
  animation:punchBody .28s ease;
}

.kickAnim .leg2{
  animation:kickLeg .35s ease;
}

.kickAnim{
  animation:kickBody .35s ease;
}

.hitAnim{
  animation:hitBody .28s ease;
}

.jumpAnim{
  animation:jump .55s ease;
}

.jumpAttackAnim{
  animation:jumpAttack .5s ease;
}

.blockAnim{
  filter:brightness(1.35) drop-shadow(0 0 15px #738cff);
}

.specialAnim{
  animation:specialBody .6s ease;
}

@keyframes punchArm{
  0%{transform:rotate(-20deg)}
  45%{transform:rotate(-85deg) translateX(35px)}
  100%{transform:rotate(-20deg)}
}

@keyframes punchBody{
  45%{transform:translateX(22px) scale(1.04)}
}

@keyframes kickLeg{
  0%{transform:rotate(0)}
  45%{transform:rotate(70deg) translateX(20px)}
  100%{transform:rotate(0)}
}

@keyframes kickBody{
  45%{transform:translateX(18px) rotate(-3deg)}
}

@keyframes hitBody{
  15%{transform:translateX(-17px) rotate(-4deg)}
  40%{transform:translateX(16px) rotate(4deg)}
  70%{transform:translateX(-8px)}
}

@keyframes jump{
  50%{transform:translateY(-130px) scale(1.05)}
}

@keyframes jumpAttack{
  40%{
    transform:
      translate(35px,-110px)
      rotate(-7deg)
      scale(1.08);
  }
}

@keyframes specialBody{
  30%{
    transform:scale(1.12);
    filter:brightness(2);
  }
  60%{
    transform:scale(.95);
  }
}

/* ================= EFFECTS ================= */

.flash{
  position:absolute;
  width:140px;
  height:140px;
  border-radius:50%;
  pointer-events:none;
  background:
    radial-gradient(circle,#fff 0 5%,#00eaff 12%,#5a00ff 30%,transparent 68%);
  animation:flash .45s forwards;
  z-index:20;
}

@keyframes flash{
  from{
    transform:scale(.2);
    opacity:1;
  }
  to{
    transform:scale(2);
    opacity:0;
  }
}

.spark{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px #00eaff;
  pointer-events:none;
  z-index:25;
  animation:spark .5s forwards;
}

@keyframes spark{
  to{
    transform:translate(
      var(--x),
      var(--y)
    ) scale(.1);
    opacity:0;
  }
}

.damage{
  position:absolute;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  text-shadow:0 0 10px #ff2020;
  animation:damage .7s forwards;
  z-index:30;
}

@keyframes damage{
  to{
    transform:translateY(-65px) scale(1.3);
    opacity:0;
  }
}

.critical{
  position:absolute;
  color:#ffd400;
  font-size:27px;
  font-weight:bold;
  text-shadow:0 0 15px #ff6200;
  animation:critical .8s forwards;
  z-index:31;
}

@keyframes critical{
  0%{
    transform:scale(.4);
    opacity:0;
  }
  30%{
    transform:scale(1.3);
    opacity:1;
  }
  100%{
    transform:translateY(-80px);
    opacity:0;
  }
}

/* camera shake */

.shake{
  animation:cameraShake .25s;
}

@keyframes cameraShake{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-5px,2px)}
  40%{transform:translate(5px,-2px)}
  60%{transform:translate(-4px,1px)}
  80%{transform:translate(4px,-1px)}
}

/* ================= MESSAGE ================= */

#message{
  min-height:28px;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 0 10px #00d9ff;
}

/* ================= BUTTONS ================= */

.controls{
  width:96%;
  max-width:850px;
  margin:auto;
}

.row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin:7px 0;
}

button{
  min-width:88px;
  padding:12px 8px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:13px;
  font-weight:bold;
  background:#202b40;
  box-shadow:0 4px 0 #080c13;
  transition:.1s;
}

button:active{
  transform:translateY(3px) scale(.97);
  box-shadow:none;
}

.move{background:#263d5c}
.attack{background:#e87918}
.kick{background:#d83b45}
.block{background:#4055c8}
.jump{background:#087f8c}
.combo{background:linear-gradient(135deg,#ff7b00,#ff1744)}
.special{background:linear-gradient(135deg,#8e24aa,#d81bff)}
.restart{background:#149447}

.disabled{
  opacity:.4;
}

/* ================= ROUND SCREEN ================= */

.roundScreen{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(4px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.roundScreen h2{
  margin:5px;
  font-size:34px;
  color:#ffd54a;
  text-shadow:0 0 15px #ff8c00;
}

.roundScreen p{
  color:#ddd;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

  .arena{
    height:350px;
  }

  .fighter{
    transform:scale(.78);
    transform-origin:bottom center;
  }

  .ground{
    height:105px;
  }

  button{
    min-width:76px;
    padding:11px 6px;
    font-size:11px;
  }

  h1{
    font-size:22px;
  }

  .round{
    min-width:92px;
    font-size:13px;
  }

  .pillar{
    display:none;
  }
}
</style>
</head>

<body>

<h1>⚔️ ARENA FIGHTER 2.0</h1>

<div class="subtitle">
REALISTIC ARENA • COMBO • SPECIAL • FIGHT
</div>

<div class="top">

  <div class="box">
    <div class="name">🔵 PLAYER</div>

    <div class="bar">
      <div id="playerHP" class="fill hp"></div>
    </div>

    <div class="bar">
      <div id="playerEnergy" class="fill energy"></div>
    </div>
  </div>

  <div class="round">
    🏆 ROUND
    <span id="roundNumber">1</span>
    <small>BEST OF 3</small>
  </div>

  <div class="box">
    <div class="name">🔴 ENEMY</div>

    <div class="bar">
      <div id="enemyHP" class="fill ehp"></div>
    </div>

    <div class="bar">
      <div id="enemyEnergy" class="fill energy"></div>
    </div>
  </div>

</div>

<div class="arena" id="arena">

  <div class="pillar left"></div>
  <div class="pillar right"></div>

  <div class="light l"></div>
  <div class="light r"></div>

  <!-- PLAYER -->

  <div id="player" class="fighter">

    <div class="head"></div>

    <div class="body playerBody"></div>

    <div class="arm arm1 playerArm"></div>
    <div class="arm arm2 playerArm"></div>

    <div class="leg leg1 playerLeg"></div>
    <div class="leg leg2 playerLeg"></div>

  </div>

  <!-- ENEMY -->

  <div id="enemy" class="fighter">

    <div class="head"></div>

    <div class="body enemyBody"></div>

    <div class="arm arm1 enemyArm"></div>
    <div class="arm arm2 enemyArm"></div>

    <div class="leg leg1 enemyLeg"></div>
    <div class="leg leg2 enemyLeg"></div>

  </div>

  <div class="ground"></div>

  <div id="roundScreen" class="roundScreen hidden">
    <h2 id="roundTitle">ROUND 1</h2>
    <p id="roundText">GET READY!</p>
  </div>

</div>

<div id="message">🔥 FIGHT!</div>

<div class="controls">

  <div class="row">

    <button class="move" onclick="moveLeft()">⬅️ LEFT</button>

    <button class="move" onclick="moveRight()">RIGHT ➡️</button>

    <button class="jump" onclick="jump()">🦘 JUMP</button>

  </div>

  <div class="row">

    <button class="attack" onclick="punch()">👊 PUNCH</button>

    <button class="kick" onclick="kick()">🦵 KICK</button>

    <button class="block" onclick="block()">🛡️ BLOCK</button>

    <button class="jump" onclick="jumpAttack()">🦘 JUMP ATTACK</button>

  </div>

  <div class="row">

    <button class="combo" onclick="comboAttack()">🔥 4-HIT COMBO</button>

    <button id="specialBtn" class="special" onclick="specialAttack()">⚡ SPECIAL</button>

    <button class="restart" onclick="restartGame()">🔄 RESTART</button>

  </div>

</div>

<script>

let playerHP=100;
let enemyHP=100;

let playerEnergy=0;
let enemyEnergy=0;

let playerX=70;

let round=1;

let playerWins=0;
let enemyWins=0;

let blocking=false;
let jumping=false;
let comboBusy=false;
let gameOver=false;

let enemyTimer=null;

const player=document.getElementById("player");
const enemy=document.getElementById("enemy");
const arena=document.getElementById("arena");

const AudioContext=window.AudioContext||window.webkitAudioContext;
let audio;

function sound(type){

  try{

    if(!audio)
      audio=new AudioContext();

    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.connect(gain);
    gain.connect(audio.destination);

    const frequencies={
      hit:140,
      kick:90,
      jump:380,
      special:650,
      critical:900,
      win:800
    };

    osc.frequency.value=frequencies[type]||200;
    gain.gain.value=.12;

    osc.start();

    setTimeout(()=>{
      osc.stop();
    },140);

  }catch(e){}

}

function updateBars(){

  document.getElementById("playerHP").style.width=playerHP+"%";
  document.getElementById("enemyHP").style.width=enemyHP+"%";

  document.getElementById("playerEnergy").style.width=playerEnergy+"%";
  document.getElementById("enemyEnergy").style.width=enemyEnergy+"%";

  document.getElementById("roundNumber").innerText=round;

  const btn=document.getElementById("specialBtn");

  if(playerEnergy<100)
    btn.classList.add("disabled");
  else
    btn.classList.remove("disabled");
}

function message(text){
  document.getElementById("message").innerText=text;
}

function moveLeft(){

  if(gameOver)return;

  playerX-=25;

  if(playerX<10)
    playerX=10;

  player.style.left=playerX+"px";
}

function moveRight(){

  if(gameOver)return;

  playerX+=25;

  const max=arena.clientWidth-110;

  if(playerX>max)
    playerX=max;

  player.style.left=playerX+"px";
}

function jump(){

  if(gameOver||jumping)return;

  jumping=true;

  sound("jump");

  player.classList.add("jumpAnim");

  message("🦘 JUMP!");

  setTimeout(()=>{

    player.classList.remove("jumpAnim");
    jumping=false;

  },550);
}

function attackAnimation(type){

  player.classList.add(type);

  setTimeout(()=>{
    player.classList.remove(type);
  },400);
}

function hitAnimation(){

  enemy.classList.add("hitAnim");

  arena.classList.add("shake");

  setTimeout(()=>{
    enemy.classList.remove("hitAnim");
    arena.classList.remove("shake");
  },300);
}

/* HIT SPARKS */

function sparks(){

  for(let i=0;i<10;i++){

    const s=document.createElement("div");

    s.className="spark";

    s.style.left=(enemy.offsetLeft+45)+"px";
    s.style.top=(enemy.offsetTop+55)+"px";

    s.style.setProperty(
      "--x",
      (Math.random()*100-50)+"px"
    );

    s.style.setProperty(
      "--y",
      (Math.random()*100-50)+"px"
    );

    arena.appendChild(s);

    setTimeout(()=>{
      s.remove();
    },500);
  }
}

function flash(){

  const f=document.createElement("div");

  f.className="flash";

  f.style.left=(enemy.offsetLeft-20)+"px";
  f.style.top=(enemy.offsetTop+25)+"px";

  arena.appendChild(f);

  sparks();

  setTimeout(()=>{
    f.remove();
  },450);
}

function damageText(value,critical=false){

  const d=document.createElement("div");

  d.className=critical?"critical":"damage";

  d.innerText=critical
    ?"💥 CRITICAL! -"+value
    :"-"+value;

  d.style.left=(enemy.offsetLeft+5)+"px";
  d.style.top=(enemy.offsetTop-20)+"px";

  arena.appendChild(d);

  setTimeout(()=>{
    d.remove();
  },800);
}

function dealDamage(amount){

  const critical=Math.random()<.18;

  if(critical)
    amount*=2;

  enemyHP-=amount;

  if(enemyHP<0)
    enemyHP=0;

  damageText(amount,critical);

  if(critical)
    sound("critical");
  else
    sound("hit");

  hitAnimation();
  sparks();

  return amount;
}

function punch(){

  if(gameOver||comboBusy)return;

  const damage=Math.floor(Math.random()*6)+8;

  dealDamage(damage);

  playerEnergy+=15;

  if(playerEnergy>100)
    playerEnergy=100;

  attackAnimation("punchAnim");

  message("👊 PUNCH!");

  updateBars();

  enemyTurn();
}

function kick(){

  if(gameOver||comboBusy)return;

  const damage=Math.floor(Math.random()*8)+12;

  dealDamage(damage);

  playerEnergy+=20;

  if(playerEnergy>100)
    playerEnergy=100;

  attackAnimation("kickAnim");

  sound("kick");

  message("🦵 POWER KICK!");

  updateBars();

  enemyTurn();
}

function jumpAttack(){

  if(gameOver||jumping||comboBusy)return;

  jumping=true;

  player.classList.add("jumpAttackAnim");

  sound("jump");

  setTimeout(()=>{

    const damage=Math.floor(Math.random()*10)+16;

    dealDamage(damage);

    playerEnergy+=20;

    if(playerEnergy>100)
      playerEnergy=100;

    message("🦘💥 JUMP ATTACK!");

    updateBars();

  },220);

  setTimeout(()=>{

    player.classList.remove("jumpAttackAnim");

    jumping=false;

    enemyTurn();

  },500);
}

function block(){

  if(gameOver)return;

  blocking=true;

  player.classList.add("blockAnim");

  message("🛡️ BLOCKING!");

  setTimeout(()=>{

    blocking=false;

    player.classList.remove("blockAnim");

  },900);
}

function comboAttack(){

  if(gameOver||comboBusy)return;

  comboBusy=true;

  message("🔥 4-HIT COMBO!");

  let hits=0;

  const interval=setInterval(()=>{

    if(gameOver){

      clearInterval(interval);
      comboBusy=false;
      return;
    }

    hits++;

    const damage=Math.floor(Math.random()*4)+5;

    dealDamage(damage);

    playerEnergy+=7;

    if(playerEnergy>100)
      playerEnergy=100;

    attackAnimation(
      hits%2
      ?"punchAnim"
      :"kickAnim"
    );

    updateBars();

    if(hits>=4){

      clearInterval(interval);

      comboBusy=false;

      message("🔥 COMBO COMPLETE!");

      setTimeout(()=>{
        enemyTurn();
      },250);
    }

  },180);
}

function specialAttack(){

  if(gameOver)return;

  if(playerEnergy<100){

    message("⚡ ENERGY NOT FULL!");

    return;
  }

  playerEnergy=0;

  const damage=Math.floor(Math.random()*11)+30;

  enemyHP-=damage;

  if(enemyHP<0)
    enemyHP=0;

  player.classList.add("specialAnim");

  flash();

  sound("special");

  damageText(damage,false);

  message("⚡🔥 SPECIAL ATTACK!");

  updateBars();

  setTimeout(()=>{
    player.classList.remove("specialAnim");
  },600);

  enemyTurn();
}

function enemyTurn(){

  if(enemyHP<=0){

    winRound();
    return;
  }

  clearTimeout(enemyTimer);

  enemyTimer=setTimeout(()=>{

    if(gameOver)return;

    let damage;

    const special=
      enemyEnergy>=100 &&
      Math.random()<.30;

    if(special){

      enemyEnergy=0;

      damage=Math.floor(Math.random()*12)+24;

      message("🔴 ENEMY SPECIAL!");

    }else{

      damage=Math.floor(Math.random()*9)+6;

      enemyEnergy+=18;

      if(enemyEnergy>100)
        enemyEnergy=100;

      message("💥 ENEMY ATTACK!");
    }

    if(blocking){

      damage=Math.floor(damage/2);

      message("🛡️ BLOCKED! -"+damage);
    }

    playerHP-=damage;

    if(playerHP<0)
      playerHP=0;

    updateBars();

    if(playerHP<=0){

      loseRound();
      return;
    }

  },650);
}

function winRound(){

  playerWins++;

  sound("win");

  if(playerWins>=2){

    gameOver=true;

    showMatchWinner("🏆 YOU WIN THE MATCH!");

    return;
  }

  nextRound(true);
}

function loseRound(){

  enemyWins++;

  if(enemyWins>=2){

    gameOver=true;

    showMatchWinner("💀 ENEMY WINS THE MATCH!");

    return;
  }

  nextRound(false);
}

function nextRound(playerWon){

  round++;

  playerHP=100;
  enemyHP=100;

  playerEnergy=0;
  enemyEnergy=0;

  blocking=false;
  jumping=false;
  comboBusy=false;

  playerX=70;

  player.style.left=playerX+"px";

  updateBars();

  const screen=document.getElementById("roundScreen");

  const title=document.getElementById("roundTitle");

  const text=document.getElementById("roundText");

  title.innerText="🏆 ROUND "+round;

  text.innerText=playerWon
    ?"🔥 ROUND WON! KEEP FIGHTING!"
    :"⚔️ COMEBACK TIME!";

  screen.classList.remove("hidden");

  setTimeout(()=>{

    screen.classList.add("hidden");

    message("🔥 ROUND "+round+" — FIGHT!");

  },1500);
}

function showMatchWinner(text){

  const screen=document.getElementById("roundScreen");

  const title=document.getElementById("roundTitle");

  const sub=document.getElementById("roundText");

  title.innerText=text;

  sub.innerText=
    "🏆 "+playerWins+" - "+enemyWins+" 🏆";

  screen.classList.remove("hidden");

  message(text);
}

function restartGame(){

  clearTimeout(enemyTimer);

  playerHP=100;
  enemyHP=100;

  playerEnergy=0;
  enemyEnergy=0;

  playerX=70;

  round=1;

  playerWins=0;
  enemyWins=0;

  blocking=false;
  jumping=false;
  comboBusy=false;
  gameOver=false;

  player.style.left=playerX+"px";

  document
    .getElementById("roundScreen")
    .classList.add("hidden");

  updateBars();

  message("🔥 ROUND 1 — FIGHT!");
}

updateBars();

</script>

</body>
</html>
