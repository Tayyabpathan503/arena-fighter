<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arena Fighter 2.0</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#070914;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:10px 0 2px;
  font-size:25px;
  text-shadow:0 0 14px #00d9ff;
}

.subtitle{
  color:#91a0bd;
  font-size:12px;
  margin-bottom:8px;
}

.status{
  width:94%;
  max-width:900px;
  margin:auto;
  display:flex;
  gap:8px;
}

.statusBox{
  flex:1;
  background:#111827;
  border:1px solid #293750;
  border-radius:12px;
  padding:7px;
}

.name{
  font-size:12px;
  font-weight:bold;
}

.bar{
  height:14px;
  margin-top:4px;
  background:#252b3a;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:100%;
  transition:width .2s;
}

.hp{background:#20e070}
.enemyhp{background:#ff4055}
.energy{background:#00cfff}

.arena{
  position:relative;
  width:94%;
  max-width:900px;
  height:420px;
  margin:10px auto;
  overflow:hidden;
  border:2px solid #34415e;
  border-radius:18px;
  background:
  radial-gradient(circle at 50% 20%,#29416b,#12182b 48%,#080b15);
  box-shadow:0 0 30px rgba(0,200,255,.15);
}

.arena:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:55%;
  height:2px;
  background:#38506d;
  box-shadow:0 45px 0 #25344c,0 90px 0 #1b293e;
}

.ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:62px;
  background:linear-gradient(#182235,#0b101a);
  border-top:2px solid #52647f;
}

.fighter{
  position:absolute;
  bottom:62px;
  width:58px;
  height:100px;
  border-radius:18px 18px 8px 8px;
  z-index:3;
}

.fighter:before{
  content:"";
  position:absolute;
  width:42px;
  height:42px;
  left:8px;
  top:-38px;
  border-radius:50%;
  background:#ffd0a6;
  border:3px solid #111;
}

.fighter:after{
  content:"";
  position:absolute;
  width:76px;
  height:10px;
  left:-9px;
  bottom:-12px;
  border-radius:50%;
  background:rgba(0,0,0,.4);
}

#player{
  left:70px;
  background:linear-gradient(#25b8ff,#1765e8);
  box-shadow:0 0 18px rgba(0,190,255,.5);
}

#enemy{
  right:70px;
  background:linear-gradient(#ff5364,#c51f3c);
  box-shadow:0 0 18px rgba(255,40,70,.45);
}

.attackAnim{
  animation:attack .22s;
}

.hitAnim{
  animation:hit .22s;
}

.jumpAnim{
  animation:jump .55s ease;
}

@keyframes attack{
  50%{transform:translateX(22px) scale(1.08)}
}

@keyframes hit{
  25%{transform:translateX(-12px)}
  50%{transform:translateX(12px)}
  75%{transform:translateX(-6px)}
}

@keyframes jump{
  50%{transform:translateY(-120px)}
}

#message{
  min-height:28px;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 0 10px #00d9ff;
}

.controls{
  width:96%;
  max-width:850px;
  margin:auto;
}

.row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin:7px 0;
}

button{
  min-width:92px;
  padding:13px 9px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:13px;
  font-weight:bold;
  background:#202b40;
  box-shadow:0 4px 0 #080c13;
}

button:active{
  transform:translateY(3px);
  box-shadow:none;
}

.attack{background:#e87918}
.kick{background:#d83b45}
.block{background:#4055c8}
.special{
  background:linear-gradient(135deg,#8e24aa,#d81bff);
}
.jump{background:#087f8c}
.combo{
  background:linear-gradient(135deg,#ff7b00,#ff1744);
}
.move{background:#26344d}
.restart{background:#149447}

.disabled{
  opacity:.4;
}

.flash{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,#fff,#00d9ff,transparent 65%);
  animation:flash .4s forwards;
  z-index:10;
}

@keyframes flash{
  from{transform:scale(.2);opacity:1}
  to{transform:scale(1.7);opacity:0}
}

.comboText{
  position:absolute;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  text-shadow:0 0 12px #ff7300;
  animation:comboText .7s forwards;
  z-index:20;
  pointer-events:none;
}

@keyframes comboText{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-70px);opacity:0}
}

@media(max-width:500px){
  .arena{height:340px}
  button{
    min-width:82px;
    padding:11px 7px;
    font-size:12px;
  }
  h1{font-size:22px}
}
</style>
</head>

<body>

<h1>⚔️ ARENA FIGHTER 2.0</h1>
<div class="subtitle">Battle • Jump • Combo • Special</div>

<div class="status">

  <div class="statusBox">
    <div class="name">🔵 PLAYER</div>

    <div class="bar">
      <div id="playerHP" class="fill hp"></div>
    </div>

    <div class="bar">
      <div id="playerEnergy" class="fill energy"></div>
    </div>
  </div>

  <div class="statusBox">
    <div class="name">🔴 ENEMY</div>

    <div class="bar">
      <div id="enemyHP" class="fill enemyhp"></div>
    </div>

    <div class="bar">
      <div id="enemyEnergy" class="fill energy"></div>
    </div>
  </div>

</div>

<div class="arena" id="arena">

  <div id="player" class="fighter"></div>
  <div id="enemy" class="fighter"></div>

  <div class="ground"></div>

</div>

<div id="message">🔥 FIGHT!</div>

<div class="controls">

  <div class="row">
    <button class="move" onclick="moveLeft()">⬅️ LEFT</button>
    <button class="move" onclick="moveRight()">RIGHT ➡️</button>
    <button class="jump" onclick="jump()">🦘 JUMP</button>
  </div>

  <div class="row">
    <button class="attack" onclick="punch()">👊 PUNCH</button>
    <button class="kick" onclick="kick()">🦵 KICK</button>
    <button class="block" onclick="block()">🛡️ BLOCK</button>
  </div>

  <div class="row">

    <button class="combo" onclick="comboAttack()">
      🔥 COMBO
    </button>

    <button id="specialBtn" class="special" onclick="specialAttack()">
      ⚡ SPECIAL
    </button>

    <button class="restart" onclick="restartGame()">
      🔄 RESTART
    </button>

  </div>

</div>

<script>

let playerHP=100;
let enemyHP=100;

let playerEnergy=0;
let enemyEnergy=0;

let playerX=70;

let blocking=false;
let jumping=false;
let gameOver=false;

let enemyTimer=null;
let comboBusy=false;

/* SOUND */

const AudioContext =
window.AudioContext || window.webkitAudioContext;

let audio;

function sound(type){

  try{

    if(!audio)
      audio=new AudioContext();

    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.connect(gain);
    gain.connect(audio.destination);

    if(type==="hit"){
      osc.frequency.value=130;
      gain.gain.value=.12;
    }

    if(type==="kick"){
      osc.frequency.value=90;
      gain.gain.value=.14;
    }

    if(type==="special"){
      osc.frequency.value=600;
      gain.gain.value=.15;
    }

    if(type==="jump"){
      osc.frequency.value=350;
      gain.gain.value=.08;
    }

    if(type==="win"){
      osc.frequency.value=800;
      gain.gain.value=.15;
    }

    osc.start();

    setTimeout(()=>{
      osc.stop();
    },150);

  }catch(e){}

}

const player=document.getElementById("player");
const enemy=document.getElementById("enemy");
const arena=document.getElementById("arena");

function updateBars(){

  document.getElementById("playerHP").style.width=
    playerHP+"%";

  document.getElementById("enemyHP").style.width=
    enemyHP+"%";

  document.getElementById("playerEnergy").style.width=
    playerEnergy+"%";

  document.getElementById("enemyEnergy").style.width=
    enemyEnergy+"%";

  const btn=document.getElementById("specialBtn");

  if(playerEnergy<100)
    btn.classList.add("disabled");
  else
    btn.classList.remove("disabled");
}

function showMessage(text){
  document.getElementById("message").innerText=text;
}

function moveLeft(){

  if(gameOver)return;

  playerX-=25;

  if(playerX<10)
    playerX=10;

  player.style.left=playerX+"px";
}

function moveRight(){

  if(gameOver)return;

  playerX+=25;

  const max=arena.clientWidth-80;

  if(playerX>max)
    playerX=max;

  player.style.left=playerX+"px";
}

function jump(){

  if(gameOver || jumping)return;

  jumping=true;

  sound("jump");

  player.classList.add("jumpAnim");

  showMessage("🦘 JUMP!");

  setTimeout(()=>{

    player.classList.remove("jumpAnim");
    jumping=false;

  },550);
}

function hitAnimation(){

  enemy.classList.add("hitAnim");

  setTimeout(()=>{
    enemy.classList.remove("hitAnim");
  },220);
}

function attackAnimation(){

  player.classList.add("attackAnim");

  setTimeout(()=>{
    player.classList.remove("attackAnim");
  },220);
}

function effect(){

  const flash=document.createElement("div");

  flash.className="flash";

  flash.style.left=
    (enemy.offsetLeft-30)+"px";

  flash.style.top=
    (enemy.offsetTop-10)+"px";

  arena.appendChild(flash);

  setTimeout(()=>{
    flash.remove();
  },400);
}

function comboText(){

  const text=document.createElement("div");

  text.className="comboText";

  text.innerText="🔥 COMBO!";

  text.style.left=
    (enemy.offsetLeft-10)+"px";

  text.style.top=
    (enemy.offsetTop-40)+"px";

  arena.appendChild(text);

  setTimeout(()=>{
    text.remove();
  },700);
}

function punch(){

  if(gameOver)return;

  sound("hit");

  const damage=
    Math.floor(Math.random()*6)+8;

  enemyHP-=damage;

  if(enemyHP<0)
    enemyHP=0;

  playerEnergy+=15;

  if(playerEnergy>100)
    playerEnergy=100;

  attackAnimation();
  hitAnimation();

  showMessage("👊 PUNCH  -"+damage);

  updateBars();

  enemyTurn();
}

function kick(){

  if(gameOver)return;

  sound("kick");

  const damage=
    Math.floor(Math.random()*7)+12;

  enemyHP-=damage;

  if(enemyHP<0)
    enemyHP=0;

  playerEnergy+=20;

  if(playerEnergy>100)
    playerEnergy=100;

  attackAnimation();
  hitAnimation();

  showMessage("🦵 KICK  -"+damage);

  updateBars();

  enemyTurn();
}

function comboAttack(){

  if(gameOver || comboBusy)return;

  comboBusy=true;

  sound("hit");

  let damage=0;

  attackAnimation();
  hitAnimation();

  damage=
    Math.floor(Math.random()*8)+18;

  enemyHP-=damage;

  if(enemyHP<0)
    enemyHP=0;

  playerEnergy+=25;

  if(playerEnergy>100)
    playerEnergy=100;

  comboText();

  showMessage("🔥 3-HIT COMBO  -"+damage);

  updateBars();

  setTimeout(()=>{

    comboBusy=false;

    enemyTurn();

  },350);
}

function specialAttack(){

  if(gameOver)return;

  if(playerEnergy<100){

    showMessage("⚡ ENERGY NOT FULL!");

    return;
  }

  playerEnergy=0;

  sound("special");

  const damage=
    Math.floor(Math.random()*11)+30;

  enemyHP-=damage;

  if(enemyHP<0)
    enemyHP=0;

  effect();
  hitAnimation();

  showMessage(
    "⚡🔥 SPECIAL ATTACK! -"+damage
  );

  updateBars();

  enemyTurn();
}

function block(){

  if(gameOver)return;

  blocking=true;

  showMessage("🛡️ BLOCKING!");

  setTimeout(()=>{

    blocking=false;

  },900);
}

function enemyTurn(){

  if(enemyHP<=0){

    gameOver=true;

    sound("win");

    showMessage("🏆 YOU WIN!");

    return;
  }

  clearTimeout(enemyTimer);

  enemyTimer=setTimeout(()=>{

    if(gameOver)return;

    let damage;

    const special=
      enemyEnergy>=100 &&
      Math.random()<.35;

    if(special){

      enemyEnergy=0;

      damage=
        Math.floor(Math.random()*10)+25;

      showMessage("🔴 ENEMY SPECIAL!");

    }else{

      damage=
        Math.floor(Math.random()*9)+6;

      enemyEnergy+=18;

      if(enemyEnergy>100)
        enemyEnergy=100;

      showMessage("💥 ENEMY ATTACK!");

    }

    if(blocking){

      damage=Math.floor(damage/2);

      showMessage(
        "🛡️ BLOCKED! -"+damage
      );
    }

    playerHP-=damage;

    if(playerHP<0)
      playerHP=0;

    updateBars();

    if(playerHP<=0){

      gameOver=true;

      showMessage("💀 YOU LOSE!");

      return;
    }

  },650);
}

function restartGame(){

  clearTimeout(enemyTimer);

  playerHP=100;
  enemyHP=100;

  playerEnergy=0;
  enemyEnergy=0;

  playerX=70;

  blocking=false;
  jumping=false;
  comboBusy=false;
  gameOver=false;

  player.style.left=
    playerX+"px";

  updateBars();

  showMessage("🔥 FIGHT!");

}

updateBars();

</script>

</body>
</html>
