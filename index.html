
  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Fighter 3.0</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at 50% 0%,#16233f 0%,#050711 55%);
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow-x:hidden;
}

h1{
  margin:10px 0 2px;
  font-size:25px;
  text-shadow:0 0 15px #00d9ff;
}

.subtitle{
  color:#91a0bd;
  font-size:12px;
  margin-bottom:8px;
}

/* STATUS */

.top{
  width:94%;
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.box{
  flex:1;
  background:rgba(17,24,39,.94);
  border:1px solid #293750;
  border-radius:12px;
  padding:7px;
}

.name{
  font-size:12px;
  font-weight:bold;
}

.bar{
  height:14px;
  margin-top:4px;
  background:#252b3a;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:100%;
  transition:width .25s ease;
}

.hp{
  background:linear-gradient(90deg,#0bc95b,#4dff9b);
}

.ehp{
  background:linear-gradient(90deg,#ff173d,#ff6978);
}

.energy{
  background:linear-gradient(90deg,#008cff,#00efff);
}

/* ROUND */

.round{
  min-width:105px;
  padding:8px;
  border-radius:11px;
  background:#171f33;
  border:1px solid #ffd54a;
  color:#ffd54a;
  font-size:15px;
  font-weight:bold;
  text-shadow:0 0 8px #ff9800;
}

.round small{
  display:block;
  margin-top:3px;
  color:#fff;
  font-size:9px;
}

/* ARENA */

.arena{
  position:relative;
  width:94%;
  max-width:900px;
  height:430px;
  margin:10px auto;
  overflow:hidden;
  border:2px solid #394864;
  border-radius:18px;

  background:
    radial-gradient(
      circle at 50% 18%,
      #496b9d 0%,
      #263a5e 23%,
      #111a30 52%,
      #050811 100%
    );

  box-shadow:
    0 0 35px rgba(0,200,255,.18),
    inset 0 0 70px rgba(0,0,0,.55);
}

/* BACK WALL */

.arena:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:51%;
  height:2px;
  background:#58718f;

  box-shadow:
    0 38px 0 rgba(68,91,119,.65),
    0 76px 0 rgba(48,66,91,.55),
    0 114px 0 rgba(35,49,70,.45);
}

/* LIGHTS */

.arena:after{
  content:"";
  position:absolute;
  top:15px;
  left:50%;
  width:280px;
  height:180px;
  transform:translateX(-50%);
  background:radial-gradient(
    ellipse,
    rgba(0,217,255,.22),
    transparent 70%
  );
  pointer-events:none;
}

/* GROUND */

.ground{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:
    linear-gradient(#263750,#0b101a);
  border-top:2px solid #647b99;
  z-index:2;
}

.ground:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:27px;
  height:1px;
  background:#344961;
}

.ground:after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:2px;
  height:100%;
  background:rgba(99,126,158,.35);
  box-shadow:
    -150px 0 rgba(99,126,158,.18),
    150px 0 rgba(99,126,158,.18);
}

/* FIGHTER */

.fighter{
  position:absolute;
  bottom:70px;
  width:65px;
  height:125px;
  z-index:5;
  transition:left .08s linear;
}

/* BODY */

.fighter .body{
  position:absolute;
  left:15px;
  top:36px;
  width:38px;
  height:57px;
  border-radius:12px 12px 7px 7px;
  border:2px solid rgba(0,0,0,.65);
  box-shadow:
    inset 5px 0 rgba(255,255,255,.14),
    inset -6px 0 rgba(0,0,0,.2);
}

/* HEAD */

.fighter .head{
  position:absolute;
  left:13px;
  top:-2px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(
    145deg,
    #ffe1c2,
    #d99568
  );
  border:3px solid #121212;
  z-index:4;
}

/* HAIR */

.fighter .hair{
  position:absolute;
  left:14px;
  top:-4px;
  width:40px;
  height:18px;
  border-radius:20px 20px 5px 5px;
  background:#171717;
  z-index:6;
}

/* EYES */

.fighter .eye{
  position:absolute;
  top:18px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#111;
  z-index:7;
}

.fighter .eye.one{
  left:23px;
}

.fighter .eye.two{
  left:36px;
}

/* ARMS */

.fighter .arm{
  position:absolute;
  top:40px;
  width:15px;
  height:48px;
  border-radius:10px;
  background:inherit;
  border:2px solid rgba(0,0,0,.5);
  transform-origin:top center;
}

.fighter .arm.left{
  left:3px;
  transform:rotate(12deg);
}

.fighter .arm.right{
  right:3px;
  transform:rotate(-12deg);
}

/* GLOVES */

.fighter .glove{
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#20252e;
  border:2px solid #090b10;
  z-index:5;
}

.fighter .glove.left{
  left:0;
  top:80px;
}

.fighter .glove.right{
  right:0;
  top:80px;
}

/* LEGS */

.fighter .leg{
  position:absolute;
  top:88px;
  width:17px;
  height:38px;
  border-radius:5px 5px 10px 10px;
  background:inherit;
  border:2px solid rgba(0,0,0,.55);
}

.fighter .leg.left{
  left:15px;
}

.fighter .leg.right{
  right:15px;
}

/* SHOES */

.fighter .shoe{
  position:absolute;
  width:25px;
  height:12px;
  border-radius:10px;
  background:#11151d;
  bottom:-3px;
}

.fighter .shoe.left{
  left:8px;
}

.fighter .shoe.right{
  right:8px;
}

/* PLAYER COLORS */

#player .body,
#player .arm,
#player .leg{
  background:linear-gradient(
    180deg,
    #32d2ff,
    #1254db
  );
}

#player{
  left:70px;
  filter:drop-shadow(0 0 12px rgba(0,190,255,.5));
}

/* ENEMY */

#enemy .body,
#enemy .arm,
#enemy .leg{
  background:linear-gradient(
    180deg,
    #ff6674,
    #a91536
  );
}

#enemy{
  right:70px;
  filter:drop-shadow(0 0 12px rgba(255,30,60,.5));
}

/* SHADOW */

.fighter:after{
  content:"";
  position:absolute;
  left:-10px;
  bottom:-8px;
  width:85px;
  height:12px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  filter:blur(3px);
  z-index:-1;
}

/* ANIMATIONS */

.punchAnim{
  animation:punch .25s ease;
}

.kickAnim{
  animation:kick .3s ease;
}

.hitAnim{
  animation:hit .28s ease;
}

.jumpAnim{
  animation:jump .55s ease;
}

.jumpAttackAnim{
  animation:jumpAttack .5s ease;
}

.blockAnim{
  filter:
    brightness(1.35)
    drop-shadow(0 0 12px #4e6cff) !important;
}

@keyframes punch{
  50%{
    transform:
      translateX(30px)
      scale(1.06);
  }
}

@keyframes kick{
  50%{
    transform:
      translateX(35px)
      scale(1.07);
  }
}

@keyframes hit{
  15%{transform:translateX(-16px)}
  35%{transform:translateX(15px)}
  55%{transform:translateX(-10px)}
  75%{transform:translateX(6px)}
}

@keyframes jump{
  50%{
    transform:translateY(-125px);
  }
}

@keyframes jumpAttack{
  40%{
    transform:
      translateY(-105px)
      translateX(30px)
      scale(1.1);
  }
}

/* MESSAGE */

#message{
  min-height:28px;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 0 10px #00d9ff;
}

/* CONTROLS */

.controls{
  width:96%;
  max-width:850px;
  margin:auto;
}

.row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin:7px 0;
}

button{
  min-width:88px;
  padding:12px 8px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:13px;
  font-weight:bold;
  background:#202b40;
  box-shadow:0 4px 0 #080c13;
  cursor:pointer;
}

button:active{
  transform:translateY(3px);
  box-shadow:none;
}

.move{
  background:#26344d;
}

.attack{
  background:#e87918;
}

.kick{
  background:#d83b45;
}

.block{
  background:#4055c8;
}

.jump{
  background:#087f8c;
}

.combo{
  background:linear-gradient(
    135deg,
    #ff7b00,
    #ff1744
  );
}

.special{
  background:linear-gradient(
    135deg,
    #8e24aa,
    #d81bff
  );
}

.restart{
  background:#149447;
}

.disabled{
  opacity:.4;
}

/* EFFECTS */

.flash{
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(
    circle,
    #fff,
    #00d9ff,
    transparent 68%
  );
  animation:flash .4s forwards;
  z-index:20;
}

@keyframes flash{
  from{
    transform:scale(.2);
    opacity:1;
  }

  to{
    transform:scale(1.8);
    opacity:0;
  }
}

.damage{
  position:absolute;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  text-shadow:0 0 10px #ff2020;
  animation:damage .7s forwards;
  z-index:30;
  pointer-events:none;
}

@keyframes damage{
  from{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  to{
    transform:translateY(-65px) scale(1.3);
    opacity:0;
  }
}

.critical{
  position:absolute;
  color:#ffd400;
  font-size:25px;
  font-weight:bold;
  text-shadow:0 0 15px #ff6200;
  animation:critical .8s forwards;
  z-index:31;
  pointer-events:none;
}

@keyframes critical{
  0%{
    transform:scale(.4);
    opacity:0;
  }

  30%{
    transform:scale(1.3);
    opacity:1;
  }

  100%{
    transform:translateY(-80px);
    opacity:0;
  }
}

/* ROUND SCREEN */

.roundScreen{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.roundScreen h2{
  margin:5px;
  font-size:34px;
  color:#ffd54a;
  text-shadow:0 0 15px #ff8c00;
}

.roundScreen p{
  color:#ddd;
}

.hidden{
  display:none !important;
}

/* CAMERA SHAKE */

.shake{
  animation:cameraShake .25s;
}

@keyframes cameraShake{
  0%{transform:translate(0)}
  25%{transform:translate(-5px,2px)}
  50%{transform:translate(5px,-2px)}
  75%{transform:translate(-3px,2px)}
  100%{transform:translate(0)}
}

/* MOBILE */

@media(max-width:500px){

  h1{
    font-size:22px;
  }

  .arena{
    height:350px;
  }

  .fighter{
    transform:scale(.88);
    transform-origin:bottom center;
  }

  button{
    min-width:78px;
    padding:11px 6px;
    font-size:11px;
  }

  .round{
    min-width:92px;
    font-size:13px;
  }

  .roundScreen h2{
    font-size:28px;
  }
}
</style>
</head>

<body>

<h1>⚔️ ARENA FIGHTER 3.0</h1>

<div class="subtitle">
FIGHT • COMBO • JUMP • SPECIAL
</div>

<!-- STATUS -->

<div class="top">

  <div class="box">

    <div class="name">
      🔵 PLAYER
    </div>

    <div class="bar">
      <div id="playerHP" class="fill hp"></div>
    </div>

    <div class="bar">
      <div id="playerEnergy" class="fill energy"></div>
    </div>

  </div>

  <div class="round">
    🏆 ROUND
    <span id="roundNumber">1</span>

    <small>
      BEST OF 3
    </small>
  </div>

  <div class="box">

    <div class="name">
      🔴 ENEMY
    </div>

    <div class="bar">
      <div id="enemyHP" class="fill ehp"></div>
    </div>

    <div class="bar">
      <div id="enemyEnergy" class="fill energy"></div>
    </div>

  </div>

</div>

<!-- ARENA -->

<div class="arena" id="arena">

  <div id="player" class="fighter">

    <div class="head">
      <div class="hair"></div>
      <div class="eye one"></div>
      <div class="eye two"></div>
    </div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="glove left"></div>
    <div class="glove right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="shoe left"></div>
    <div class="shoe right"></div>

  </div>

  <div id="enemy" class="fighter">

    <div class="head">
      <div class="hair"></div>
      <div class="eye one"></div>
      <div class="eye two"></div>
    </div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="glove left"></div>
    <div class="glove right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="shoe left"></div>
    <div class="shoe right"></div>

  </div>

  <div class="ground"></div>

  <!-- ROUND POPUP -->
  <div id="roundScreen" class="roundScreen hidden">

    <h2 id="roundTitle">
      ROUND 1
    </h2>

    <p id="roundText">
      GET READY!
    </p>

  </div>

</div>

<div id="message">
🔥 FIGHT!
</div>

<!-- CONTROLS -->

<div class="controls">

  <div class="row">

    <button class="move" onclick="moveLeft()">
      ⬅️ LEFT
    </button>

    <button class="move" onclick="moveRight()">
      RIGHT ➡️
    </button>

    <button class="jump" onclick="jump()">
      🦘 JUMP
    </button>

  </div>

  <div class="row">

    <button class="attack" onclick="punch()">
      👊 PUNCH
    </button>

    <button class="kick" onclick="kick()">
      🦵 KICK
    </button>

    <button class="block" onclick="block()">
      🛡️ BLOCK
    </button>

    <button class="jump" onclick="jumpAttack()">
      🦘 JUMP ATTACK
    </button>

  </div>

  <div class="row">

    <button class="combo" onclick="comboAttack()">
      🔥 4-HIT COMBO
    </button>

    <button id="specialBtn" class="special" onclick="specialAttack()">
      ⚡ SPECIAL
    </button>

    <button class="restart" onclick="restartGame()">
      🔄 RESTART
    </button>

  </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

let playerHP = 100;
let enemyHP = 100;

let playerEnergy = 0;
let enemyEnergy = 0;

let playerX = 70;

let round = 1;

let playerWins = 0;
let enemyWins = 0;

let blocking = false;
let jumping = false;
let comboBusy = false;
let gameOver = false;

let enemyTimer = null;
let roundTimer = null;


/* =========================
   ELEMENTS
========================= */

const player =
document.getElementById("player");

const enemy =
document.getElementById("enemy");

const arena =
document.getElementById("arena");

const roundScreen =
document.getElementById("roundScreen");


/* =========================
   SOUND
========================= */

const AudioContext =
window.AudioContext ||
window.webkitAudioContext;

let audio = null;

function sound(type){

  try{

    if(!audio){
      audio = new AudioContext();
    }

    if(audio.state === "suspended"){
      audio.resume();
    }

    const osc =
    audio.createOscillator();

    const gain =
    audio.createGain();

    osc.connect(gain);
    gain.connect(audio.destination);

    if(type === "hit")
      osc.frequency.value = 140;

    if(type === "kick")
      osc.frequency.value = 90;

    if(type === "jump")
      osc.frequency.value = 380;

    if(type === "special")
      osc.frequency.value = 650;

    if(type === "critical")
      osc.frequency.value = 900;

    if(type === "win")
      osc.frequency.value = 800;

    gain.gain.value = .12;

    osc.start();

    setTimeout(()=>{
      try{
        osc.stop();
      }catch(e){}
    },140);

  }catch(e){}

}


/* =========================
   UI
========================= */

function updateBars(){

  document.getElementById(
    "playerHP"
  ).style.width =
    Math.max(0,playerHP) + "%";

  document.getElementById(
    "enemyHP"
  ).style.width =
    Math.max(0,enemyHP) + "%";

  document.getElementById(
    "playerEnergy"
  ).style.width =
    Math.min(100,playerEnergy) + "%";

  document.getElementById(
    "enemyEnergy"
  ).style.width =
    Math.min(100,enemyEnergy) + "%";

  document.getElementById(
    "roundNumber"
  ).innerText = round;

  const btn =
  document.getElementById("specialBtn");

  if(playerEnergy < 100){
    btn.classList.add("disabled");
  }else{
    btn.classList.remove("disabled");
  }

}


/* =========================
   MESSAGE
========================= */

function message(text){

  document.getElementById(
    "message"
  ).innerText = text;

}


/* =========================
   MOVEMENT
========================= */

function moveLeft(){

  if(gameOver || roundScreen.classList.contains("hidden") === false)
    return;

  playerX -= 25;

  if(playerX < 10)
    playerX = 10;

  player.style.left =
    playerX + "px";

}


function moveRight(){

  if(gameOver || roundScreen.classList.contains("hidden") === false)
    return;

  playerX += 25;

  const max =
    arena.clientWidth - 80;

  if(playerX > max)
    playerX = max;

  player.style.left =
    playerX + "px";

}


/* =========================
   JUMP
========================= */

function jump(){

  if(
    gameOver ||
    jumping ||
    !roundScreen.classList.contains("hidden")
  )
    return;

  jumping = true;

  sound("jump");

  player.classList.add(
    "jumpAnim"
  );

  message("🦘 JUMP!");

  setTimeout(()=>{

    player.classList.remove(
      "jumpAnim"
    );

    jumping = false;

  },550);

}


/* =========================
   ANIMATION
========================= */

function attackAnimation(type){

  player.classList.remove(
    "punchAnim",
    "kickAnim"
  );

  void player.offsetWidth;

  player.classList.add(type);

  setTimeout(()=>{

    player.classList.remove(type);

  },350);

}


function hitAnimation(){

  enemy.classList.remove(
    "hitAnim"
  );

  void enemy.offsetWidth;

  enemy.classList.add(
    "hitAnim"
  );

  arena.classList.remove(
    "shake"
  );

  void arena.offsetWidth;

  arena.classList.add(
    "shake"
  );

  setTimeout(()=>{

    enemy.classList.remove(
      "hitAnim"
    );

  },300);

}


/* =========================
   FLASH
========================= */

function flash(){

  const f =
  document.createElement("div");

  f.className = "flash";

  f.style.left =
    (enemy.offsetLeft - 35) + "px";

  f.style.top =
    (enemy.offsetTop - 15) + "px";

  arena.appendChild(f);

  setTimeout(()=>{
    f.remove();
  },400);

}


/* =========================
   DAMAGE TEXT
========================= */

function damageText(
  value,
  critical = false
){

  const d =
  document.createElement("div");

  d.className =
    critical
    ? "critical"
    : "damage";

  d.innerText =
    critical
    ? "💥 CRITICAL - " + value
    : "-" + value;

  d.style.left =
    (enemy.offsetLeft + 5) + "px";

  d.style.top =
    (enemy.offsetTop - 20) + "px";

  arena.appendChild(d);

  setTimeout(()=>{
    d.remove();
  },800);

}


/* =========================
   DAMAGE
========================= */

function dealDamage(amount){

  const critical =
    Math.random() < .18;

  if(critical){
    amount *= 2;
    amount = Math.floor(amount);
  }

  enemyHP -= amount;

  if(enemyHP < 0)
    enemyHP = 0;

  damageText(
    amount,
    critical
  );

  if(critical)
    sound("critical");
  else
    sound("hit");

  hitAnimation();

  updateBars();

  if(enemyHP <= 0){

    setTimeout(()=>{
      winRound();
    },250);

  }

  return amount;

}


/* =========================
   PUNCH
========================= */

function punch(){

  if(
    gameOver ||
    comboBusy ||
    enemyHP <= 0 ||
    !roundScreen.classList.contains("hidden")
  )
    return;

  const damage =
    Math.floor(Math.random()*6) + 8;

  attackAnimation("punchAnim");

  message("👊 PUNCH!");

  dealDamage(damage);

  playerEnergy += 15;

  if(playerEnergy > 100)
    playerEnergy = 100;

  updateBars();

  if(enemyHP > 0)
    enemyTurn();

}


/* =========================
   KICK
========================= */

function kick(){

  if(
    gameOver ||
    comboBusy ||
    enemyHP <= 0 ||
    !roundScreen.classList.contains("hidden")
  )
    return;

  const damage =
    Math.floor(Math.random()*8) + 12;

  attackAnimation("kickAnim");

  sound("kick");

  message("🦵 POWER KICK!");

  dealDamage(damage);

  playerEnergy += 20;

  if(playerEnergy > 100)
    playerEnergy = 100;

  updateBars();

  if(enemyHP > 0)
    enemyTurn();

}


/* =========================
   JUMP ATTACK
========================= */

function jumpAttack(){

  if(
    gameOver ||
    jumping ||
    comboBusy ||
    enemyHP <= 0 ||
    !roundScreen.classList.contains("hidden")
  )
    return;

  jumping = true;

  player.classList.add(
    "jumpAttackAnim"
  );

  sound("jump");

  message("🦘 JUMP ATTACK!");

  setTimeout(()=>{

    if(gameOver)
      return;

    const damage =
      Math.floor(Math.random()*10) + 16;

    dealDamage(damage);

    playerEnergy += 20;

    if(playerEnergy > 100)
      playerEnergy = 100;

    updateBars();

  },220);

  setTimeout(()=>{

    player.classList.remove(
      "jumpAttackAnim"
    );

    jumping = false;

    if(!gameOver && enemyHP > 0)
      enemyTurn();

  },500);

}


/* =========================
   BLOCK
========================= */

function block(){

  if(
    gameOver ||
    !roundScreen.classList.contains("hidden")
  )
    return;

  blocking = true;

  player.classList.add(
    "blockAnim"
  );

  message("🛡️ BLOCKING!");

  setTimeout(()=>{

    blocking = false;

    player.classList.remove(
      "blockAnim"
    );

  },900);

}


/* =========================
   COMBO
========================= */

function comboAttack(){

  if(
    gameOver ||
    comboBusy ||
    enemyHP <= 0 ||
    !roundScreen.classList.contains("hidden")
  )
    return;

  comboBusy = true;

  message("🔥 4-HIT COMBO!");

  let hits = 0;

  const interval =
  setInterval(()=>{

    if(
      gameOver ||
      enemyHP <= 0
    ){

      clearInterval(interval);
      comboBusy = false;

      return;
    }

    hits++;

    const damage =
      Math.floor(Math.random()*4) + 5;

    dealDamage(damage);

    playerEnergy += 7;

    if(playerEnergy > 100)
      playerEnergy = 100;

    attackAnimation(
      hits % 2
      ? "punchAnim"
      : "kickAnim"
    );

    updateBars();

    if(hits >= 4){

      clearInterval(interval);

      comboBusy = false;

      if(enemyHP > 0){

        message(
          "🔥 COMBO COMPLETE!"
        );

        setTimeout(()=>{
          if(!gameOver)
            enemyTurn();
        },300);

      }

    }

  },180);

}


/* =========================
   SPECIAL
========================= */

function specialAttack(){

  if(
    gameOver ||
    !roundScreen.classList.contains("hidden")
  )
    return;

  if(playerEnergy < 100){

    message(
      "⚡ ENERGY NOT FULL!"
    );

    return;
  }

  playerEnergy = 0;

  const damage =
    Math.floor(Math.random()*11) + 30;

  enemyHP -= damage;

  if(enemyHP < 0)
    enemyHP = 0;

  flash();

  sound("special");

  damageText(
    damage,
    false
  );

  hitAnimation();

  message(
    "⚡🔥 SPECIAL ATTACK!"
  );

  updateBars();

  if(enemyHP <= 0){

    setTimeout(()=>{
      winRound();
    },300);

    return;
  }

  enemyTurn();

}


/* =========================
   ENEMY AI
========================= */

function enemyTurn(){

  if(
    gameOver ||
    enemyHP <= 0
  )
    return;

  clearTimeout(enemyTimer);

  enemyTimer =
  setTimeout(()=>{

    if(
      gameOver ||
      playerHP <= 0
    )
      return;

    let damage;

    const special =
      enemyEnergy >= 100 &&
      Math.random() < .30;

    if(special){

      enemyEnergy = 0;

      damage =
        Math.floor(Math.random()*12) + 24;

      message(
        "🔴 ENEMY SPECIAL!"
      );

    }else{

      damage =
        Math.floor(Math.random()*9) + 6;

      enemyEnergy += 18;

      if(enemyEnergy > 100)
        enemyEnergy = 100;

      message(
        "💥 ENEMY ATTACK!"
      );

    }

    if(blocking){

      damage =
        Math.floor(damage / 2);

      message(
        "🛡️ BLOCKED! -" + damage
      );

    }

    playerHP -= damage;

    if(playerHP < 0)
      playerHP = 0;

    updateBars();

    if(playerHP <= 0){

      loseRound();

    }

  },650);

}


/* =========================
   WIN ROUND
========================= */

function winRound(){

  if(gameOver)
    return;

  clearTimeout(enemyTimer);

  playerWins++;

  sound("win");

  if(playerWins >= 2){

    gameOver = true;

    showMatchWinner(
      "🏆 YOU WIN THE MATCH!"
    );

    return;
  }

  nextRound(true);

}


/* =========================
   LOSE ROUND
========================= */

function loseRound(){

  if(gameOver)
    return;

  clearTimeout(enemyTimer);

  enemyWins++;

  if(enemyWins >= 2){

    gameOver = true;

    showMatchWinner(
      "💀 ENEMY WINS THE MATCH!"
    );

    return;
  }

  nextRound(false);

}


/* =========================
   NEXT ROUND
========================= */

function nextRound(playerWon){

  clearTimeout(enemyTimer);
  clearTimeout(roundTimer);

  round++;

  playerHP = 100;
  enemyHP = 100;

  playerEnergy = 0;
  enemyEnergy = 0;

  blocking = false;
  jumping = false;
  comboBusy = false;

  playerX = 70;

  player.style.left =
    playerX + "px";

  player.classList.remove(
    "punchAnim",
    "kickAnim",
    "hitAnim",
    "jumpAnim",
    "jumpAttackAnim",
    "blockAnim"
  );

  enemy.classList.remove(
    "hitAnim"
  );

  updateBars();

  const title =
    document.getElementById(
      "roundTitle"
    );

  const text =
    document.getElementById(
      "roundText"
    );

  title.innerText =
    "🏆 ROUND " + round;

  text.innerText =
    playerWon
    ? "🔥 ROUND WON! GET READY!"
    : "⚔️ COMEBACK TIME!";

  roundScreen.classList.remove(
    "hidden"
  );

  roundTimer =
  setTimeout(()=>{

    roundScreen.classList.add(
      "hidden"
    );

    message(
      "🔥 ROUND " + round + " — FIGHT!"
    );

  },1500);

}


/* =========================
   MATCH WINNER
========================= */

function showMatchWinner(text){

  clearTimeout(enemyTimer);

  const title =
    document.getElementById(
      "roundTitle"
    );

  const sub =
    document.getElementById(
      "roundText"
    );

  title.innerText = text;

  sub.innerText =
    "🏆 SCORE: " +
    playerWins +
    " - " +
    enemyWins +
    " 🏆";

  roundScreen.classList.remove(
    "hidden"
  );

  message(text);

}


/* =========================
   RESTART
========================= */

function restartGame(){

  clearTimeout(enemyTimer);
  clearTimeout(roundTimer);

  playerHP = 100;
  enemyHP = 100;

  playerEnergy = 0;
  enemyEnergy = 0;

  playerX = 70;

  round = 1;

  playerWins = 0;
  enemyWins = 0;

  blocking = false;
  jumping = false;
  comboBusy = false;
  gameOver = false;

  player.style.left =
    playerX + "px";

  player.classList.remove(
    "punchAnim",
    "kickAnim",
    "hitAnim",
    "jumpAnim",
    "jumpAttackAnim",
    "blockAnim"
  );

  enemy.classList.remove(
    "hitAnim"
  );

  roundScreen.classList.add(
    "hidden"
  );

  updateBars();

  message(
    "🔥 ROUND 1 — FIGHT!"
  );

}


/* =========================
   START GAME
========================= */

roundScreen.classList.add(
  "hidden"
);

updateBars();

message(
  "🔥 ROUND 1 — FIGHT!"
);

</script>
