<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arena Fighter 2.0</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#050711;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:10px 0 2px;
  font-size:25px;
  text-shadow:0 0 15px #00d9ff;
}

.subtitle{
  color:#91a0bd;
  font-size:12px;
  margin-bottom:8px;
}

/* TOP STATUS */

.top{
  width:94%;
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.box{
  flex:1;
  background:#111827;
  border:1px solid #293750;
  border-radius:12px;
  padding:7px;
}

.name{
  font-size:12px;
  font-weight:bold;
}

.bar{
  height:14px;
  margin-top:4px;
  background:#252b3a;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:100%;
  transition:width .25s;
}

.hp{
  background:#19df70;
}

.ehp{
  background:#ff4055;
}

.energy{
  background:#00cfff;
}

/* ROUND */

.round{
  min-width:105px;
  padding:8px;
  border-radius:11px;
  background:#171f33;
  border:1px solid #ffd54a;
  color:#ffd54a;
  font-size:15px;
  font-weight:bold;
  text-shadow:0 0 8px #ff9800;
}

.round small{
  display:block;
  margin-top:3px;
  color:#fff;
  font-size:9px;
}

/* ARENA */

.arena{
  position:relative;
  width:94%;
  max-width:900px;
  height:430px;
  margin:10px auto;
  overflow:hidden;
  border:2px solid #394864;
  border-radius:18px;
  background:
    radial-gradient(circle at 50% 15%,#304c78,#151c31 45%,#070a12);
  box-shadow:0 0 35px rgba(0,200,255,.15);
}

.arena:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:52%;
  height:2px;
  background:#405875;
  box-shadow:
    0 45px 0 #2b3d55,
    0 90px 0 #203046;
}

.ground{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:linear-gradient(#1a263a,#090d16);
  border-top:2px solid #596b86;
}

/* FIGHTERS */

.fighter{
  position:absolute;
  bottom:65px;
  width:58px;
  height:105px;
  border-radius:18px 18px 8px 8px;
  z-index:5;
}

.fighter:before{
  content:"";
  position:absolute;
  width:43px;
  height:43px;
  left:7px;
  top:-39px;
  border-radius:50%;
  background:#ffd0a6;
  border:3px solid #111;
}

.fighter:after{
  content:"";
  position:absolute;
  width:80px;
  height:10px;
  left:-11px;
  bottom:-13px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
}

#player{
  left:70px;
  background:linear-gradient(#27c1ff,#155de1);
  box-shadow:0 0 22px rgba(0,200,255,.5);
}

#enemy{
  right:70px;
  background:linear-gradient(#ff5c6c,#bd1838);
  box-shadow:0 0 22px rgba(255,30,60,.45);
}

/* ANIMATIONS */

.punchAnim{
  animation:punch .25s;
}

.kickAnim{
  animation:kick .3s;
}

.hitAnim{
  animation:hit .25s;
}

.jumpAnim{
  animation:jump .55s ease;
}

.jumpAttackAnim{
  animation:jumpAttack .5s ease;
}

.blockAnim{
  filter:brightness(1.5);
}

@keyframes punch{
  50%{
    transform:translateX(28px) scale(1.08);
  }
}

@keyframes kick{
  50%{
    transform:translateX(32px) scale(1.08);
  }
}

@keyframes hit{
  20%{transform:translateX(-14px)}
  45%{transform:translateX(14px)}
  70%{transform:translateX(-8px)}
}

@keyframes jump{
  50%{
    transform:translateY(-125px);
  }
}

@keyframes jumpAttack{
  40%{
    transform:translateY(-105px)
    translateX(30px)
    scale(1.1);
  }
}

/* MESSAGE */

#message{
  min-height:28px;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 0 10px #00d9ff;
}

/* BUTTONS */

.controls{
  width:96%;
  max-width:850px;
  margin:auto;
}

.row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin:7px 0;
}

button{
  min-width:88px;
  padding:12px 8px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:13px;
  font-weight:bold;
  background:#202b40;
  box-shadow:0 4px 0 #080c13;
}

button:active{
  transform:translateY(3px);
  box-shadow:none;
}

.move{
  background:#26344d;
}

.attack{
  background:#e87918;
}

.kick{
  background:#d83b45;
}

.block{
  background:#4055c8;
}

.jump{
  background:#087f8c;
}

.combo{
  background:linear-gradient(135deg,#ff7b00,#ff1744);
}

.special{
  background:linear-gradient(135deg,#8e24aa,#d81bff);
}

.restart{
  background:#149447;
}

.disabled{
  opacity:.4;
}

/* EFFECTS */

.flash{
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(
    circle,
    #fff,
    #00d9ff,
    transparent 68%
  );
  animation:flash .4s forwards;
  z-index:20;
}

@keyframes flash{
  from{
    transform:scale(.2);
    opacity:1;
  }

  to{
    transform:scale(1.8);
    opacity:0;
  }
}

.damage{
  position:absolute;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  text-shadow:0 0 10px #ff2020;
  animation:damage .7s forwards;
  z-index:30;
}

@keyframes damage{
  from{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  to{
    transform:translateY(-65px) scale(1.3);
    opacity:0;
  }
}

.critical{
  position:absolute;
  color:#ffd400;
  font-size:27px;
  font-weight:bold;
  text-shadow:0 0 15px #ff6200;
  animation:critical .8s forwards;
  z-index:31;
}

@keyframes critical{
  0%{
    transform:scale(.4);
    opacity:0;
  }

  30%{
    transform:scale(1.3);
    opacity:1;
  }

  100%{
    transform:translateY(-80px);
    opacity:0;
  }
}

/* ROUND SCREEN */

.roundScreen{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.roundScreen h2{
  margin:5px;
  font-size:34px;
  color:#ffd54a;
  text-shadow:0 0 15px #ff8c00;
}

.roundScreen p{
  color:#ddd;
}

.hidden{
  display:none;
}

/* MOBILE */

@media(max-width:500px){

  .arena{
    height:350px;
  }

  button{
    min-width:78px;
    padding:11px 6px;
    font-size:11px;
  }

  h1{
    font-size:22px;
  }

  .round{
    min-width:92px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<h1>⚔️ ARENA FIGHTER 2.0</h1>

<div class="subtitle">
  FIGHT • COMBO • JUMP • SPECIAL
</div>

<!-- STATUS -->

<div class="top">

  <div class="box">

    <div class="name">
      🔵 PLAYER
    </div>

    <div class="bar">
      <div
        id="playerHP"
        class="fill hp">
      </div>
    </div>

    <div class="bar">
      <div
        id="playerEnergy"
        class="fill energy">
      </div>
    </div>

  </div>

  <!-- CLEAR ROUND DISPLAY -->

  <div class="round">

    🏆 ROUND
    <span id="roundNumber">1</span>

    <small>
      BEST OF 3
    </small>

  </div>

  <div class="box">

    <div class="name">
      🔴 ENEMY
    </div>

    <div class="bar">
      <div
        id="enemyHP"
        class="fill ehp">
      </div>
    </div>

    <div class="bar">
      <div
        id="enemyEnergy"
        class="fill energy">
      </div>
    </div>

  </div>

</div>

<!-- ARENA -->

<div class="arena" id="arena">

  <div
    id="player"
    class="fighter">
  </div>

  <div
    id="enemy"
    class="fighter">
  </div>

  <div class="ground"></div>

  <!-- ROUND POPUP -->

  <div
    id="roundScreen"
    class="roundScreen hidden">

    <h2 id="roundTitle">
      ROUND 1
    </h2>

    <p id="roundText">
      GET READY!
    </p>

  </div>

</div>

<div id="message">
  🔥 FIGHT!
</div>

<!-- CONTROLS -->

<div class="controls">

  <div class="row">

    <button
      class="move"
      onclick="moveLeft()">
      ⬅️ LEFT
    </button>

    <button
      class="move"
      onclick="moveRight()">
      RIGHT ➡️
    </button>

    <button
      class="jump"
      onclick="jump()">
      🦘 JUMP
    </button>

  </div>

  <div class="row">

    <button
      class="attack"
      onclick="punch()">
      👊 PUNCH
    </button>

    <button
      class="kick"
      onclick="kick()">
      🦵 KICK
    </button>

    <button
      class="block"
      onclick="block()">
      🛡️ BLOCK
    </button>

    <button
      class="jump"
      onclick="jumpAttack()">
      🦘 JUMP ATTACK
    </button>

  </div>

  <div class="row">

    <button
      class="combo"
      onclick="comboAttack()">
      🔥 4-HIT COMBO
    </button>

    <button
      id="specialBtn"
      class="special"
      onclick="specialAttack()">
      ⚡ SPECIAL
    </button>

    <button
      class="restart"
      onclick="restartGame()">
      🔄 RESTART
    </button>

  </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

let playerHP=100;
let enemyHP=100;

let playerEnergy=0;
let enemyEnergy=0;

let playerX=70;

let round=1;

let playerWins=0;
let enemyWins=0;

let blocking=false;
let jumping=false;
let comboBusy=false;
let gameOver=false;

let enemyTimer=null;


/* =========================
   ELEMENTS
========================= */

const player=
document.getElementById("player");

const enemy=
document.getElementById("enemy");

const arena=
document.getElementById("arena");


/* =========================
   SOUND SYSTEM
========================= */

const AudioContext=
window.AudioContext ||
window.webkitAudioContext;

let audio;

function sound(type){

  try{

    if(!audio)
      audio=new AudioContext();

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.connect(gain);

    gain.connect(
      audio.destination
    );

    if(type==="hit")
      osc.frequency.value=140;

    if(type==="kick")
      osc.frequency.value=90;

    if(type==="jump")
      osc.frequency.value=380;

    if(type==="special")
      osc.frequency.value=650;

    if(type==="critical")
      osc.frequency.value=900;

    if(type==="win")
      osc.frequency.value=800;

    gain.gain.value=.12;

    osc.start();

    setTimeout(()=>{
      osc.stop();
    },140);

  }catch(e){}

}


/* =========================
   UPDATE UI
========================= */

function updateBars(){

  document.getElementById(
    "playerHP"
  ).style.width=
    playerHP+"%";

  document.getElementById(
    "enemyHP"
  ).style.width=
    enemyHP+"%";

  document.getElementById(
    "playerEnergy"
  ).style.width=
    playerEnergy+"%";

  document.getElementById(
    "enemyEnergy"
  ).style.width=
    enemyEnergy+"%";

  document.getElementById(
    "roundNumber"
  ).innerText=
    round;

  const btn=
    document.getElementById(
      "specialBtn"
    );

  if(playerEnergy<100)
    btn.classList.add(
      "disabled"
    );
  else
    btn.classList.remove(
      "disabled"
    );
}


/* =========================
   MESSAGE
========================= */

function message(text){

  document.getElementById(
    "message"
  ).innerText=text;

}


/* =========================
   MOVEMENT
========================= */

function moveLeft(){

  if(gameOver)
    return;

  playerX-=25;

  if(playerX<10)
    playerX=10;

  player.style.left=
    playerX+"px";
}


function moveRight(){

  if(gameOver)
    return;

  playerX+=25;

  const max=
    arena.clientWidth-80;

  if(playerX>max)
    playerX=max;

  player.style.left=
    playerX+"px";
}


/* =========================
   JUMP
========================= */

function jump(){

  if(
    gameOver ||
    jumping
  )
    return;

  jumping=true;

  sound("jump");

  player.classList.add(
    "jumpAnim"
  );

  message("🦘 JUMP!");

  setTimeout(()=>{

    player.classList.remove(
      "jumpAnim"
    );

    jumping=false;

  },550);
}


/* =========================
   ANIMATIONS
========================= */

function attackAnimation(type){

  player.classList.add(type);

  setTimeout(()=>{

    player.classList.remove(type);

  },350);
}


function hitAnimation(){

  enemy.classList.add(
    "hitAnim"
  );

  setTimeout(()=>{

    enemy.classList.remove(
      "hitAnim"
    );

  },250);
}


/* =========================
   EFFECT
========================= */

function flash(){

  const f=
    document.createElement(
      "div"
    );

  f.className="flash";

  f.style.left=
    (enemy.offsetLeft-35)+"px";

  f.style.top=
    (enemy.offsetTop-15)+"px";

  arena.appendChild(f);

  setTimeout(()=>{
    f.remove();
  },400);
}


/* =========================
   DAMAGE NUMBER
========================= */

function damageText(
  value,
  critical=false
){

  const d=
    document.createElement(
      "div"
    );

  d.className=
    critical
    ? "critical"
    : "damage";

  d.innerText=
    critical
    ? "💥 CRITICAL! -"+value
    : "-"+value;

  d.style.left=
    (enemy.offsetLeft+5)+"px";

  d.style.top=
    (enemy.offsetTop-20)+"px";

  arena.appendChild(d);

  setTimeout(()=>{
    d.remove();
  },800);
}


/* =========================
   DAMAGE CALCULATION
========================= */

function dealDamage(
  amount
){

  const critical=
    Math.random()<0.18;

  if(critical)
    amount*=2;

  enemyHP-=amount;

  if(enemyHP<0)
    enemyHP=0;

  damageText(
    amount,
    critical
  );

  if(critical)
    sound("critical");
  else
    sound("hit");

  hitAnimation();

  return amount;
}


/* =========================
   PUNCH
========================= */

function punch(){

  if(
    gameOver ||
    comboBusy
  )
    return;

  const damage=
    Math.floor(
      Math.random()*6
    )+8;

  dealDamage(damage);

  playerEnergy+=15;

  if(playerEnergy>100)
    playerEnergy=100;

  attackAnimation(
    "punchAnim"
  );

  message("👊 PUNCH!");

  updateBars();

  enemyTurn();
}


/* =========================
   KICK
========================= */

function kick(){

  if(
    gameOver ||
    comboBusy
  )
    return;

  const damage=
    Math.floor(
      Math.random()*8
    )+12;

  dealDamage(damage);

  playerEnergy+=20;

  if(playerEnergy>100)
    playerEnergy=100;

  attackAnimation(
    "kickAnim"
  );

  sound("kick");

  message("🦵 POWER KICK!");

  updateBars();

  enemyTurn();
}


/* =========================
   JUMP ATTACK
========================= */

function jumpAttack(){

  if(
    gameOver ||
    jumping ||
    comboBusy
  )
    return;

  jumping=true;

  player.classList.add(
    "jumpAttackAnim"
  );

  sound("jump");

  setTimeout(()=>{

    const damage=
      Math.floor(
        Math.random()*10
      )+16;

    dealDamage(damage);

    playerEnergy+=20;

    if(playerEnergy>100)
      playerEnergy=100;

    message(
      "🦘💥 JUMP ATTACK!"
    );

    updateBars();

  },220);

  setTimeout(()=>{

    player.classList.remove(
      "jumpAttackAnim"
    );

    jumping=false;

    enemyTurn();

  },500);
}


/* =========================
   BLOCK
========================= */

function block(){

  if(gameOver)
    return;

  blocking=true;

  player.classList.add(
    "blockAnim"
  );

  message(
    "🛡️ BLOCKING!"
  );

  setTimeout(()=>{

    blocking=false;

    player.classList.remove(
      "blockAnim"
    );

  },900);
}


/* =========================
   4 HIT COMBO
========================= */

function comboAttack(){

  if(
    gameOver ||
    comboBusy
  )
    return;

  comboBusy=true;

  message(
    "🔥 4-HIT COMBO!"
  );

  let hits=0;

  const interval=
    setInterval(()=>{

      if(gameOver){

        clearInterval(
          interval
        );

        comboBusy=false;

        return;
      }

      hits++;

      const damage=
        Math.floor(
          Math.random()*4
        )+5;

      dealDamage(damage);

      playerEnergy+=7;

      if(playerEnergy>100)
        playerEnergy=100;

      attackAnimation(
        hits%2
        ? "punchAnim"
        : "kickAnim"
      );

      updateBars();

      if(hits>=4){

        clearInterval(
          interval
        );

        comboBusy=false;

        message(
          "🔥 COMBO COMPLETE!"
        );

        setTimeout(()=>{
          enemyTurn();
        },250);
      }

    },180);
}


/* =========================
   SPECIAL ATTACK
========================= */

function specialAttack(){

  if(gameOver)
    return;

  if(playerEnergy<100){

    message(
      "⚡ ENERGY NOT FULL!"
    );

    return;
  }

  playerEnergy=0;

  const damage=
    Math.floor(
      Math.random()*11
    )+30;

  enemyHP-=damage;

  if(enemyHP<0)
    enemyHP=0;

  flash();

  sound("special");

  damageText(
    damage,
    false
  );

  message(
    "⚡🔥 SPECIAL ATTACK!"
  );

  updateBars();

  enemyTurn();
}


/* =========================
   ENEMY AI
========================= */

function enemyTurn(){

  if(enemyHP<=0){

    winRound();

    return;
  }

  clearTimeout(
    enemyTimer
  );

  enemyTimer=
    setTimeout(()=>{

      if(gameOver)
        return;

      let damage;

      const special=
        enemyEnergy>=100 &&
        Math.random()<.30;

      if(special){

        enemyEnergy=0;

        damage=
          Math.floor(
            Math.random()*12
          )+24;

        message(
          "🔴 ENEMY SPECIAL!"
        );

      }else{

        damage=
          Math.floor(
            Math.random()*9
          )+6;

        enemyEnergy+=18;

        if(enemyEnergy>100)
          enemyEnergy=100;

        message(
          "💥 ENEMY ATTACK!"
        );
      }

      if(blocking){

        damage=
          Math.floor(
            damage/2
          );

        message(
          "🛡️ BLOCKED! -"+damage
        );
      }

      playerHP-=damage;

      if(playerHP<0)
        playerHP=0;

      updateBars();

      if(playerHP<=0){

        loseRound();

        return;
      }

    },650);
}


/* =========================
   ROUND WON
========================= */

function winRound(){

  playerWins++;

  sound("win");

  if(playerWins>=2){

    gameOver=true;

    showMatchWinner(
      "🏆 YOU WIN THE MATCH!"
    );

    return;
  }

  nextRound(
    true
  );
}


/* =========================
   ROUND LOST
========================= */

function loseRound(){

  enemyWins++;

  if(enemyWins>=2){

    gameOver=true;

    showMatchWinner(
      "💀 ENEMY WINS THE MATCH!"
    );

    return;
  }

  nextRound(
    false
  );
}


/* =========================
   NEXT ROUND
========================= */

function nextRound(
  playerWon
){

  round++;

  playerHP=100;
  enemyHP=100;

  playerEnergy=0;
  enemyEnergy=0;

  blocking=false;
  jumping=false;
  comboBusy=false;

  playerX=70;

  player.style.left=
    playerX+"px";

  updateBars();

  const screen=
    document.getElementById(
      "roundScreen"
    );

  const title=
    document.getElementById(
      "roundTitle"
    );

  const text=
    document.getElementById(
      "roundText"
    );

  title.innerText=
    "🏆 ROUND "+round;

  text.innerText=
    playerWon
    ? "🔥 ROUND WON! KEEP FIGHTING!"
    : "⚔️ COMEBACK TIME!";

  screen.classList.remove(
    "hidden"
  );

  setTimeout(()=>{

    screen.classList.add(
      "hidden"
    );

    message(
      "🔥 ROUND "+round+" — FIGHT!"
    );

  },1500);
}


/* =========================
   MATCH WINNER
========================= */

function showMatchWinner(
  text
){

  const screen=
    document.getElementById(
      "roundScreen"
    );

  const title=
    document.getElementById(
      "roundTitle"
    );

  const sub=
    document.getElementById(
      "roundText"
    );

  title.innerText=text;

  sub.innerText=
    "🏆 "+playerWins+
    " - "+
    enemyWins+
    " 🏆";

  screen.classList.remove(
    "hidden"
  );

  message(text);
}


/* =========================
   RESTART
========================= */

function restartGame(){

  clearTimeout(
    enemyTimer
  );

  playerHP=100;
  enemyHP=100;

  playerEnergy=0;
